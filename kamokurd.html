<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة المولد</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; direction: rtl; }
    .box { background: #1e1e1e; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 10px; border: 1px solid #333; }
    label { display: block; margin-top: 10px; font-size: 0.9em; color: #ccc; }
    input, button, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    button { background: #27ae60; cursor: pointer; font-weight: bold; margin-top: 15px; border: none; }
    textarea { height: 140px; font-family: monospace; direction: ltr; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>مولد البطاقات</h2>
    <label>الفريق الأول:</label><input type="text" id="t1">
    <label>شعار الفريق الأول:</label><input type="text" id="l1">
    <label>الفريق الثاني:</label><input type="text" id="t2">
    <label>شعار الفريق الثاني:</label><input type="text" id="l2">
    <label>التوقيت:</label><input type="time" id="tm">
    <label>رابط Iframe البث:</label><input type="text" id="url">
    <button onclick="generateJSON()">توليد الكود</button>
    <textarea id="output" readonly></textarea>
  </div>
  <script>
    let list = [];
    function generateJSON() {
      list.push({
        id: Date.now(),
        team1: document.getElementById('t1').value,
        logo1: document.getElementById('l1').value || 'https://via.placeholder.com/50',
        team2: document.getElementById('t2').value,
        logo2: document.getElementById('l2').value || 'https://via.placeholder.com/50',
        time: document.getElementById('tm').value,
        iframeUrl: document.getElementById('url').value
      });
      document.getElementById('output').value = JSON.stringify(list, null, 2);
    }
  </script>
</body>
</html>
