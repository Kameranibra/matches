<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مباريات اليوم - يلا شووت</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b20;
            --card-border: #262a32;
            --primary: #00c853;
            --text-main: #ffffff;
            --text-sub: #9e9e9e;
            --live-color: #d32f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            direction: rtl;
            padding-bottom: 40px;
        }

        header {
            background-color: #111419;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
        }

        .container {
            max-width: 750px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 38%;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; text-align: left; }

        .team img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .match-center {
            text-align: center;
            width: 24%;
        }

        .score-box {
            background: #0f1115;
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 4px;
        }

        .status {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
        }

        .status.live {
            background-color: var(--live-color);
            color: #fff;
            animation: blink 1.2s infinite;
        }

        .status.upcoming { background-color: #2e7d32; color: #fff; }
        .status.ended { background-color: #424242; color: #bbb; }

        .channel-info {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .team-name { font-size: 0.8rem; }
            .team img { width: 26px; height: 26px; }
            .score-box { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>يلا شووت - جدول مباريات اليوم</h1>
    </header>

    <div class="container">

        <a href="match1.html" class="match-card">
            <div class="team home">
                <img src="https://via.placeholder.com/32" alt="ريال مدريد">
                <span class="team-name">ريال مدريد</span>
            </div>
            
            <div class="match-center">
                <div class="score-box">2 - 1</div>
                <div><span class="status live">مباشر '68</span></div>
                <div class="channel-info">beIN Sports 1 | عصام الشوالي</div>
            </div>

            <div class="team away">
                <span class="team-name">برشلونة</span>
                <img src="https://via.placeholder.com/32" alt="برشلونة">
            </div>
        </a>

        <a href="match2.html" class="match-card">
            <div class="team home">
                <img src="https://via.placeholder.com/32" alt="مانشستر سيتي">
                <span class="team-name">مانشستر سيتي</span>
            </div>
            
            <div class="match-center">
                <div class="score-box">VS</div>
                <div><span class="status upcoming">22:00</span></div>
                <div class="channel-info">beIN Sports 2 | حفيظ دراجي</div>
            </div>

            <div class="team away">
                <span class="team-name">ليفربول</span>
                <img src="https://via.placeholder.com/32" alt="ليفربول">
            </div>
        </a>

        <div class="match-card">
            <div class="team home">
                <img src="https://via.placeholder.com/32" alt="أرسنال">
                <span class="team-name">أرسنال</span>
            </div>
            
            <div class="match-center">
                <div class="score-box">3 - 0</div>
                <div><span class="status ended">انتهت</span></div>
                <div class="channel-info">الدوري الإنجليزي</div>
            </div>

            <div class="team away">
                <span class="team-name">تشيلسي</span>
                <img src="https://via.placeholder.com/32" alt="تشيلسي">
            </div>
        </div>

    </div>

</body>
</html>
